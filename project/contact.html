<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - DTUP BO</title>
  <link rel="stylesheet" href="styles/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <header>
    <h1>Contact Us</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="catalog.html">Catalog</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="contact-form">
    <h2>Get in Touch</h2>
    <form id="contactForm" onsubmit="submitForm(event)">
      <label for="name">Name:</label>
      <input type="text" id="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" required>

      <label for="message">Message:</label>
      <textarea id="message" required></textarea>

      <button type="submit">Send</button>
    </form>
    <p id="confirmation" class="hidden">Thank you, <span id="user-name"></span>! We’ll get back to you soon.</p> <!-- Mensaje de confirmación personalizado -->
    
    <div class="social-media">
      <h3>Connect with us:</h3>
      <div class="social-links">
        <a href="https://facebook.com" aria-label="Facebook"><i class="fab fa-facebook-f"></i> Facebook</a>
        <a href="https://instagram.com" aria-label="Instagram"><i class="fab fa-instagram"></i> Instagram</a>
        <a href="https://twitter.com" aria-label="Twitter"><i class="fab fa-twitter"></i> Twitter</a>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; <span id="currentyear"></span> DTUP BO, All rights reserved</p>
    <p id="lastModified"></p>
  </footer>

  <script src="scripts/script.js"></script>
</body>
</html>
